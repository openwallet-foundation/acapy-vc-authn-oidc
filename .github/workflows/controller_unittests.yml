name: Controller Unit Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: Build, Lint, Unit + Integration Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15"]
    services:
      # A real MongoDB for the auth session tests that need atomic updates.
      mongo:
        image: mongo:8.3
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip3 install --no-cache-dir poetry==2.4.1
          poetry install --no-root
      - name: Lint with ruff
        working-directory: ./oidc-controller
        run: |
          poetry run ruff check .
      - name: Format with ruff
        run: |
          poetry run ruff format --check oidc-controller
      - name: Type check with basedpyright
        run: |
          poetry run basedpyright
      - name: Check import contracts
        working-directory: ./oidc-controller
        run: |
          poetry run lint-imports ../pyproject.toml
      - name: Unit tests
        env:
          MONGO_TEST_URL: mongodb://localhost:27017
        run: |
          poetry run pytest -m "not e2e and not integration" --log-cli-level=INFO --cov --cov-report lcov
      - name: Integration tests
        run: |
          poetry run pytest -m integration --log-cli-level=INFO
      - name: Coveralls Parallel
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          flag-name: python-${{ matrix.python-version }}
          parallel: true
  code-coverage:
    name: Generate Code Coverage
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
          carryforward: "python-3.15"
