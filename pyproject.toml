[project]
name = "acapy-vc-authn-oidc"
version = "2.5.0"
description = "Verifiable Credential Identity Provider for OpenID Connect."
authors = [ { name = "OpenWallet Foundation" } ]
license = "Apache-2.0"
readme = "README.md"
classifiers = [
            "Programming Language :: Python :: 3",
            "License :: OSI Approved :: Apache Software License",
	        "Operating System :: OS Independent",
]
repository = "https://github.com/openwallet-foundation/acapy-vc-authn-oidc"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = "^0.165.0"
jinja2 = "^3.1.6"
oic = "^1.7.0"
pymongo = "^4.20.1"
pyop = { version = "^3.4.2", extras = ["redis"] }
python-multipart = "^0.0.34" # required by fastapi to serve/upload files
qrcode = { version = "^8.2", extras = ["pil"]}
structlog = "^26.1.0"
uvicorn = { version = "^0.54.0", extras = ["standard"] }
redis = "^8.1.0"
canonicaljson = "^2.0.0" # used to provide unique consistent user identifiers"
pydantic-settings = "^2.16.3"
pyjwt = "^2.13.0"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.6"
mongomock = "^4.3.0"
pytest-asyncio = "^1.5.0"
pytest-cov = "^7.1.0"
pytest = "^9.2.0"
respx = "^0.23.1"
httpx2 = "^2.16.2"
basedpyright = "^1.40.2"
import-linter = "^2.17"

[tool.pytest.ini_options]
testpaths = ["oidc-controller"]
pythonpath = ["oidc-controller"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = "-m 'not e2e and not integration'"
markers = [
    "integration: integration tests (no external services required)",
    "e2e: end-to-end tests (requires running stack + bootstrap)",
    "connection: tests requiring USE_CONNECTION_BASED_VERIFICATION=true",
    "oob: tests requiring USE_CONNECTION_BASED_VERIFICATION=false",
    "redis: tests requiring REDIS_MODE=single and CONTROLLER_REPLICAS>=2",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/integration_tests/*",
    "*/conftest.py",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["docker/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "SIM", "UP", "PLW0603", "TID251", "T20", "PTH123"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Nested patch() blocks read fine in tests.
"**/{tests,integration_tests}/*" = ["SIM117"]
# Effect bans apply only to the pure modules. Keep this list in step with
# source_modules in the import-linter contract below.
"!oidc-controller/api/{authSessions/models.py,clientConfigurations/models.py,core/acapy/models.py,core/acapy/out_of_band.py,core/acapy/present_proof_attachment.py,core/acapy/present_proof_presentation.py,core/acapy/service_decorator.py,core/models.py,core/oidc/issue_token_service.py,verificationConfigs/helpers.py,verificationConfigs/models.py,verificationConfigs/variableSubstitutions.py}" = ["TID251", "T20", "PTH123"]

# Pure modules must not read the clock, randomness, the environment or files,
# or start processes. Take the value as an argument instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.date.today".msg = "Pass the current date in as an argument."
"datetime.datetime.now".msg = "Pass the current time in as an argument."
"datetime.datetime.today".msg = "Pass the current time in as an argument."
"datetime.datetime.utcnow".msg = "Pass the current time in as an argument."
"os.environ".msg = "Read settings in the shell and pass the value in."
"os.getenv".msg = "Read settings in the shell and pass the value in."
"pathlib".msg = "Do file I/O in the shell."
"pydantic.BaseModel".msg = "Subclass api.core.models.FrozenModel instead."
"random".msg = "Pass random values in as arguments."
"secrets".msg = "Pass random values in as arguments."
"socket".msg = "Do network I/O in the shell."
"subprocess".msg = "Run processes in the shell."
"time".msg = "Pass the current time in as an argument."

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.format]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["oidc-controller/api"]
exclude = ["**/tests", "**/integration_tests", "**/__pycache__"]
extraPaths = ["oidc-controller"]
reportMatchNotExhaustive = "error"
# Modules that pass strict mode. Add a module here once it is clean.
strict = [
    "oidc-controller/api/clientConfigurations/examples.py",
    "oidc-controller/api/clientConfigurations/models.py",
    "oidc-controller/api/core/acapy/config.py",
    "oidc-controller/api/core/acapy/models.py",
    "oidc-controller/api/core/acapy/out_of_band.py",
    "oidc-controller/api/core/acapy/present_proof_attachment.py",
    "oidc-controller/api/core/acapy/present_proof_presentation.py",
    "oidc-controller/api/core/acapy/service_decorator.py",
    "oidc-controller/api/core/auth.py",
    "oidc-controller/api/core/config.py",
    "oidc-controller/api/core/http_exception_util.py",
    "oidc-controller/api/db/collections.py",
    "oidc-controller/api/routers/cleanup.py",
    "oidc-controller/api/verificationConfigs/examples.py",
    "oidc-controller/api/verificationConfigs/variableSubstitutions.py",
]

# Keep the pure modules free of I/O. They may use settings, which are frozen,
# but must not reach the database, Redis, HTTP or the web framework, directly
# or through another module. Add a module to source_modules once it is pure.
[tool.importlinter]
root_package = "api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Pure modules do no I/O"
type = "forbidden"
source_modules = [
    "api.authSessions.models",
    "api.clientConfigurations.models",
    "api.core.acapy.models",
    "api.core.acapy.out_of_band",
    "api.core.acapy.present_proof_attachment",
    "api.core.acapy.present_proof_presentation",
    "api.core.acapy.service_decorator",
    "api.core.models",
    "api.core.oidc.issue_token_service",
    "api.verificationConfigs.helpers",
    "api.verificationConfigs.models",
    "api.verificationConfigs.variableSubstitutions",
]
forbidden_modules = [
    "fastapi",
    "httpx",
    "pymongo",
    "redis",
    "socketio",
    "starlette",
    "api.authSessions.crud",
    "api.clientConfigurations.crud",
    "api.core.acapy.client",
    "api.core.oidc.provider",
    "api.core.redis_utils",
    "api.core.webhook_utils",
    "api.db",
    "api.routers",
    "api.services",
    "api.verificationConfigs.crud",
]

# Pure functions take settings as arguments rather than reading the global.
# The two model modules are exempt because they use settings for field defaults.
[[tool.importlinter.contracts]]
name = "Pure functions do not read settings"
type = "forbidden"
source_modules = [
    "api.core.acapy.models",
    "api.core.acapy.out_of_band",
    "api.core.acapy.present_proof_attachment",
    "api.core.acapy.present_proof_presentation",
    "api.core.acapy.service_decorator",
    "api.core.models",
    "api.core.oidc.issue_token_service",
    "api.verificationConfigs.helpers",
    "api.verificationConfigs.models",
    "api.verificationConfigs.variableSubstitutions",
]
forbidden_modules = ["api.core.config"]
allow_indirect_imports = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
